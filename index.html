<!-- HTML 뼈대(body 부분까지)는 이전 답변과 동일하게 사용하세요 -->

  <script>
    // ★ 여기에 구글 앱스 스크립트(GAS) 배포 후 얻은 웹앱 URL을 입력하세요.
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxtDrm_iFgk_05de0u3mbf4tOLA4kPm-WvDdsjOXEduf_0g3T-YuQ135BiSG-kFKrSV/exec';

    const today = new Date().toISOString().split('T')[0];
    document.getElementById('input-date').value = today;
    document.getElementById('filter-date').value = today;

    let uploadQueue = [];

    async function handleFiles(event) {
      const files = event.target.files;
      if (!files || files.length === 0) return;
      
      showLoading(true);
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const base64Data = await resizeImage(file);
        
        uploadQueue.push({
          id: Date.now() + i,
          base64Data: base64Data,
          fileName: `${document.getElementById('input-date').value}_${file.name}`,
          memo: '',
          status: '정상'
        });
      }
      renderPreviewList();
      showLoading(false);
      event.target.value = '';
    }

    function resizeImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const targetHeight = 800;
            const targetWidth = Math.floor(img.width * (targetHeight / img.height));
            
            canvas.width = targetWidth;
            canvas.height = targetHeight;
            
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, 0, 0, targetWidth, targetHeight);
            
            resolve(canvas.toDataURL('image/jpeg', 0.7));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function renderPreviewList() {
      // (이전 답변의 renderPreviewList 함수 내용과 동일)
      const container = document.getElementById('preview-list');
      const submitBtn = document.getElementById('btn-submit');
      container.innerHTML = '';
      
      if (uploadQueue.length > 0) submitBtn.classList.remove('hidden');
      else submitBtn.classList.add('hidden');

      uploadQueue.forEach((item) => {
        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-2xl shadow-sm border-2 border-gray-100 flex gap-4";
        card.innerHTML = `
          <div class="w-1/3 flex-shrink-0 relative">
            <img src="${item.base64Data}" class="w-full h-32 object-cover rounded-xl border border-gray-200">
            <button onclick="removeItem(${item.id})" class="absolute -top-2 -right-2 bg-red-500 text-white w-8 h-8 rounded-full shadow font-bold">X</button>
          </div>
          <div class="w-2/3 flex flex-col justify-between">
            <input type="text" placeholder="제품명 / 특이사항 (터치)" 
                   class="w-full text-lg p-3 border-b-2 border-gray-300 focus:border-blue-500 outline-none bg-gray-50 rounded-t-lg"
                   onchange="updateQueueData(${item.id}, 'memo', this.value)" value="${item.memo}">
            <div class="flex gap-2 mt-2">
              <button onclick="updateStatus(${item.id}, '정상')" class="status-btn flex-1 py-2 rounded-xl text-lg font-bold border-2 ${item.status === '정상' ? 'bg-green-100 border-green-500 text-green-700' : 'bg-gray-100 border-gray-200 text-gray-500'}">정상</button>
              <button onclick="updateStatus(${item.id}, '임박')" class="status-btn flex-1 py-2 rounded-xl text-lg font-bold border-2 ${item.status === '임박' ? 'bg-yellow-100 border-yellow-500 text-yellow-700' : 'bg-gray-100 border-gray-200 text-gray-500'}">임박</button>
              <button onclick="updateStatus(${item.id}, '폐기대상')" class="status-btn flex-1 py-2 rounded-xl text-lg font-bold border-2 ${item.status === '폐기대상' ? 'bg-red-100 border-red-500 text-red-700' : 'bg-gray-100 border-gray-200 text-gray-500'}">폐기</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function updateQueueData(id, key, value) {
      const item = uploadQueue.find(q => q.id === id);
      if (item) item[key] = value;
    }

    function updateStatus(id, statusStr) {
      updateQueueData(id, 'status', statusStr);
      renderPreviewList();
    }

    function removeItem(id) {
      uploadQueue = uploadQueue.filter(q => q.id !== id);
      renderPreviewList();
    }

    // ★ fetch API를 활용한 데이터 서버 전송
    async function submitData() {
      if (uploadQueue.length === 0) return;
      if (GAS_URL.includes('여기에_복사한_키를_넣어주세요')) {
        alert("코드 상단에 GAS 웹앱 URL을 먼저 입력해주세요!");
        return;
      }
      
      const dateStr = document.getElementById('input-date').value;
      const locationStr = document.getElementById('input-location').value;
      
      const payload = uploadQueue.map(item => ({
        date: dateStr,
        location: locationStr,
        memo: item.memo || '메모 없음',
        status: item.status,
        base64Data: item.base64Data,
        fileName: `${dateStr}_${locationStr}_${item.status}.jpg`
      }));

      showLoading(true);
      
      try {
        // CORS Preflight 우회를 위해 text/plain 속성으로 POST 전송
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        
        const res = await response.json();
        
        showLoading(false);
        if (res.success) {
          alert(`총 ${res.count}건의 점검 사진이 성공적으로 업로드 되었습니다.`);
          uploadQueue = [];
          renderPreviewList();
          switchTab('dashboard');
        } else {
          alert('업로드 실패: ' + res.error);
        }
      } catch (err) {
        showLoading(false);
        alert('네트워크 오류가 발생했습니다: ' + err.message);
      }
    }

    // ★ fetch API를 활용한 대시보드 데이터 조회
    async function loadDashboard() {
      if (GAS_URL.includes('여기에_복사한_키를_넣어주세요')) return;

      const filterDate = document.getElementById('filter-date').value;
      const container = document.getElementById('dashboard-list');
      container.innerHTML = '<div class="text-center p-10 text-gray-500 text-xl font-bold"><i class="fa-solid fa-spinner fa-spin mr-2"></i>불러오는 중...</div>';
      
      try {
        const response = await fetch(`${GAS_URL}?action=getRecords&date=${filterDate}`);
        const res = await response.json();
        
        if (res.success) {
          renderDashboard(res.data);
        } else {
          container.innerHTML = `<div class="text-center p-10 text-red-500 font-bold">오류: ${res.message}</div>`;
        }
      } catch (err) {
        container.innerHTML = `<div class="text-center p-10 text-red-500 font-bold">데이터를 불러오지 못했습니다.</div>`;
      }
    }

    function renderDashboard(records) {
      // (이전 답변의 renderDashboard 함수 내용과 완전히 동일)
      const container = document.getElementById('dashboard-list');
      container.innerHTML = '';
      let issueCount = 0;

      if (records.length === 0) {
        container.innerHTML = '<div class="bg-white p-10 rounded-2xl shadow-sm text-center text-gray-500 text-xl font-bold">해당 날짜에 점검 기록이 없습니다.</div>';
      } else {
        records.forEach(item => {
          if (item.status === '임박' || item.status === '폐기대상') issueCount++;
          const thumbUrl = `https://drive.google.com/thumbnail?id=${item.fileId}&sz=w800`;
          
          let statusBadge = '';
          if(item.status === '정상') statusBadge = '<span class="bg-green-100 text-green-700 px-3 py-1 rounded-lg text-sm font-bold border border-green-200">정상</span>';
          if(item.status === '임박') statusBadge = '<span class="bg-yellow-100 text-yellow-700 px-3 py-1 rounded-lg text-sm font-bold border border-yellow-200">임박</span>';
          if(item.status === '폐기대상') statusBadge = '<span class="bg-red-100 text-red-700 px-3 py-1 rounded-lg text-sm font-bold border border-red-200">폐기대상</span>';

          const card = document.createElement('div');
          card.className = "bg-white rounded-2xl shadow-sm overflow-hidden flex flex-col";
          card.innerHTML = `
            <div class="h-48 w-full bg-gray-100 relative cursor-pointer" onclick="openImageModal('${thumbUrl}', '${item.fileUrl}')">
              <img src="${thumbUrl}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/800x400?text=Image+Not+Found'">
              <div class="absolute bottom-2 right-2 bg-black bg-opacity-60 text-white px-3 py-1 rounded-full text-sm">
                <i class="fa-solid fa-magnifying-glass mr-1"></i>확대
              </div>
            </div>
            <div class="p-4 space-y-2">
              <div class="flex justify-between items-center">
                <span class="text-gray-500 font-bold text-lg"><i class="fa-solid fa-location-dot mr-1"></i>${item.location}</span>
                ${statusBadge}
              </div>
              <p class="text-xl font-black text-gray-800 break-words">${item.memo}</p>
              <p class="text-sm text-gray-400 text-right">${item.timestamp}</p>
            </div>
          `;
          container.appendChild(card);
        });
      }
      document.getElementById('sum-total').innerHTML = `${records.length}<span class="text-xl font-normal ml-1">건</span>`;
      document.getElementById('sum-issue').innerHTML = `${issueCount}<span class="text-xl font-normal ml-1 text-gray-800">건</span>`;
    }

    // (이하 showLoading, switchTab, openImageModal, closeImageModal 함수는 이전과 동일)
    function showLoading(show) { document.getElementById('loading-overlay').style.display = show ? 'flex' : 'none'; }
    function switchTab(tab) {
      document.getElementById('tab-upload').classList.add('hidden');
      document.getElementById('tab-dashboard').classList.add('hidden');
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      const navUpload = document.getElementById('nav-upload');
      const navDash = document.getElementById('nav-dashboard');
      if(tab === 'upload') {
        navUpload.className = "flex-1 flex flex-col items-center p-2 text-blue-600 font-bold transition scale-110";
        navDash.className = "flex-1 flex flex-col items-center p-2 text-gray-400 font-bold transition";
        window.scrollTo(0,0);
      } else {
        navDash.className = "flex-1 flex flex-col items-center p-2 text-blue-600 font-bold transition scale-110";
        navUpload.className = "flex-1 flex flex-col items-center p-2 text-gray-400 font-bold transition";
        if(document.getElementById('dashboard-list').innerHTML.trim() === '') loadDashboard();
        window.scrollTo(0,0);
      }
    }
    function openImageModal(imgSrc, originalUrl) {
      document.getElementById('modal-img').src = imgSrc;
      document.getElementById('modal-link').href = originalUrl;
      document.getElementById('image-modal').classList.remove('hidden');
    }
    function closeImageModal() {
      document.getElementById('image-modal').classList.add('hidden');
      document.getElementById('modal-img').src = '';
    }
  </script>
